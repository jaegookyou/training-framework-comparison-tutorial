# 단노드·멀티GPU GPU 스모크(SNMG, 8장) — slime GRPO 를 실제 4B·bf16·이미지로 end-to-end.
# SGLang rollout + Megatron 학습(TP=2) + gsm8k rule reward(공유 gsm8k_score)까지 태운다.
#
# ⚠️ **왜 SNSG(1장)가 아니라 SNMG(8장)인가**: slime GRPO 는 Megatron TP=2(≥2장) + SGLang 엔진이라
#    본질적으로 멀티GPU다. Nebius RTX6000 은 노드당 1 또는 8장만 → TP=2 를 채우려면 8장 노드. 1장엔
#    SGLang KV(sglang_mem_fraction 0.7) + Megatron 4B full 이 안 들어간다. slime 은 대규모 RL 프레임워크라
#    이 스케일이 정상 사용역이다. (SFT 스윕이 slime 에서 죽은 건 config gpus=8 ↔ 런치 1장 불일치였음.)
# ⚠️ ray: 단노드 8장이면 slime 이 자체 `ray start --head --num-gpus 8` + `ray job submit`(dashboard/
#    JobAgent 로컬)으로 동작한다 — 멀티노드 JobAgent 이슈(별건)는 해당 없음.
# knob 소비: subsample=slime_grpo.py / max_steps→--num-rollout(slime_grpo.py:118-119).
#
# 대여/실행 (8장 노드 = ~$7-8/h spot, 스모크 ~$2-3):
#   set -a; source .env; set +a
#   sky launch -c tfct-grpo-slime sky/grpo.slime.sky.yaml --num-nodes 1 --gpus RTX6000:8 --infra nebius \
#     -y --down --env CONFIG=configs/grpo/_smoke_slime_snmg_gpu.yaml --env WANDB_API_KEY
#   sky down tfct-grpo-slime
extends: qwen3-4b_gsm8k__slime__full.yaml

dataset:
  subsample: 64                 # gsm8k 한 줌 (프롬프트·정답추출·reward 경로는 실제로 태움)

debug:
  max_steps: 3                  # --num-rollout 3 (SGLang rollout·reward·Megatron 학습·wandb 정합 확인)
