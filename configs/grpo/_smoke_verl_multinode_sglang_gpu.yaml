# 멀티노드 GPU 스모크(MNMG) — verl GRPO 를 **sglang rollout + full FT** 로 2노드.
#
# 목적: vLLM 0.11 async 엔진의 weight-sync 크래시(2026-07-29 6회 iteration 규명, verl_grpo.py NOTE)를
# **다른 추론 엔진(sglang)** 으로 우회해 GRPO 5스텝 완주를 증명한다. sglang 은 verl _ROLLOUT_REGISTRY
# 의 정식 백엔드(("sglang","async"))고 vLLM 과 무관한 코드경로다.
#
# ⚠️ **full 인 이유**: sglang 0.5.8 이 torchao==0.9.0 을 하드핀하는데 LoRA 경로의 peft 는 torchao>0.16
# 을 요구해 충돌한다(sglang+LoRA GPU 런에서 실측: "incompatible version of torchao"). full 은 peft 를
# 안 써 이 충돌이 없다. "sglang 이 vLLM 크래시를 우회하는가" 증명엔 full 로 충분하다(LoRA-sglang 은
# torchao 핀 충돌로 별건).
#
# ⚠️ 전용 이미지: sglang 0.5.8=torch 2.9.1 하드핀 → docker/verl-sglang.Dockerfile(torch 2.9.1+cu130,
# sglang[srt] 0.5.8, flash-attn cu13, cachetools). 런치 시 이미지 오버라이드:
#   sky launch -c tfct-verl-sglang sky/grpo.verl.sky.yaml --num-nodes 2 --gpus RTX6000:1 --cloud nebius \
#     --image-id docker:ghcr.io/jaegookyou/training-framework-comparison-tutorial/verl-sglang:latest \
#     --env CONFIG=configs/grpo/_smoke_verl_multinode_sglang_gpu.yaml --env-file .env
#   (iteration 중엔 autostop 없이 띄우고 exec 로 재싱크 → 끝나면 수동 sky down)
extends: _smoke_verl_multinode_full_gpu.yaml

image: ghcr.io/jaegookyou/training-framework-comparison-tutorial/verl-sglang:latest

verl:
  rollout_backend: sglang       # vLLM 우회 — verl 1급 백엔드, 다른 추론 엔진
