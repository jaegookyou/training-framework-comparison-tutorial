extends: _base.yaml

framework: megatron-bridge
tuning: full                  # Megatron-Bridge SFT 레시피(qwen3_4b_sft_config). LoRA 는 __lora 파일이 PEFT 레시피로.
image: ghcr.io/jaegookyou/training-framework-comparison-tutorial/megatron-bridge:latest

# Megatron 고유 knob (순수 Megatron-LM 과 같은 축). 모델 arch 는 Bridge 레시피
# (qwen3_4b_sft_config = AutoBridge.from_hf_pretrained("Qwen/Qwen3-4B"))가 제공 — Qwen3-4B 와
# Qwen3-4B-Base 는 동형 dense 라 arch 그대로, base 가중치는 convert 산출 체크포인트에서 온다.
megatron:
  tensor_model_parallel_size: 2   # NVIDIA qwen3_4b_sft_2gpu 레시피 미러(TP=2, PP=1, 2GPU → DP=1). 8B=TP4×8GPU 에서 축소
  pipeline_model_parallel_size: 1
  train_samples: 15000            # ≈ epochs(3) × traceinversion(~5k). Bridge 는 iter 단위 → entry 가 train_samples/global_batch 로 train_iters 환산

scale:
  nodes: 1
  gpus: 2
