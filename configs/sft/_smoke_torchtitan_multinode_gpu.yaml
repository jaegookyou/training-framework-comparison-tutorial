# 멀티노드 GPU 스모크 — torchtitan SFT 를 **2노드**로 end-to-end 검증(랑데부·FSDP 샤딩·wandb).
#
# 목적은 성능이 아니라 **배선**이다: torchrun static 랑데부(node_rank/master_addr)가 두 노드를 한
# job 으로 묶는지, FSDP 가 노드 경계를 넘어 샤딩하는지만 본다.
#
# **노드당 1장인 이유**(2026-07-28, 노드당 2장에서 변경): Nebius RTX6000 은 **1 또는 8 장 오퍼만**
# 존재해 2장짜리 노드를 못 빌린다(`sky gpus list -a --infra nebius` 실물 확인). 게다가 멀티노드가
# 묻는 것은 **노드 경계를 넘는가**이고, 노드 안 샤딩은 SNMG 스모크(_smoke_torchtitan_snmg_gpu)가
# 이미 본다 → 1장/노드가 질문에 정확히 대응하면서 제일 싸다(RTX6000 96GB spot $0.95/GPU-h → 2노드
# 약 $1.9/h).
#
# 대여/실행:
#   sky launch -c tfct-tt-mn sky/sft.torchtitan.sky.yaml --num-nodes 2 --gpus RTX6000:1 \
#     --cloud nebius --env CONFIG=configs/sft/_smoke_torchtitan_multinode_gpu.yaml \
#     --env WANDB_API_KEY --env HF_TOKEN
#   sky down tfct-tt-mn        # 반드시 — idle 과금 방지
#
# ⚠️ scale.gpus 는 `--gpus <T>:N` 의 N 과, scale.nodes 는 `--num-nodes` 와 **반드시 같아야** 한다.
# 어긋나면 trainers/_dist.py:resolve 가 즉시 SystemExit — dp 눈금(=nodes×gpus)이 조용히 어긋나
# step 수·유효 배치가 달라져 가로비교가 오염되는 걸 막는다.
# knob 소비: nodes/gpus→_dist.resolve=torchtitan_sft.py:73, max_steps→steps=torchtitan_sft.py:80-82.
extends: qwen3-4b_traceinversion__torchtitan__lora.yaml

scale:
  nodes: 2                      # 멀티노드
  gpus: 1                       # 노드당 1장 — 노드 경계 넘기만 본다(노드 내 샤딩=SNMG 스모크 담당)

debug:
  max_steps: 5                  # 5 step — 랑데부·샤딩·체크포인트 경로만 확인
