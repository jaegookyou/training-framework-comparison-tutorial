# 멀티노드 GPU 스모크(MNMG) — slime full SFT 를 **2노드**로. 검증 대상 = 메커니즘 ② **ray**의
# slime 변형(Megatron 백엔드 + ray placement group).
#
# **TP=1 로 내린다**: 부모 config 는 TP=2(노드 안 샤딩 전제)인데 노드당 1장이면 TP 가 노드 경계를
# 넘어 이더넷 위에서 돈다(레이어마다 all-reduce). 여기서 보려는 건 ray 부트스트랩과 노드 간 DP 다.
#
# 대여/실행:
#   sky launch -c tfct-slime-mn sky/sft.slime.sky.yaml --num-nodes 2 --gpus RTX6000:1 \
#     --cloud nebius --env CONFIG=configs/sft/_smoke_slime_multinode_gpu.yaml \
#     --env WANDB_API_KEY --env HF_TOKEN
#   sky down tfct-slime-mn
extends: _smoke_slime_gpu.yaml

slime:
  tensor_model_parallel_size: 1   # 노드당 1장 → TP 가 노드를 넘지 않게(위 주석)

scale:
  nodes: 2
  gpus: 1
