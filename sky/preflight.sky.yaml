# 이미지 진단 — 이 이미지의 torch 가 **지금 빌리는 GPU** 에서 도는가.
#
# 왜 필요한가(2026-07-28): 이미지마다 torch 출처가 다르다. 우리가 핀하는 것(trl·verl·unsloth·
# megatron)도 있고 **upstream 이미지에서 그냥 오는 것**(slime=slimerl/slime)도 있다.
# 후자는 Dockerfile 을 읽어서 알 수 없고 **띄워봐야 안다**. 학습을 12분씩 태우며 프레임워크마다
# 같은 사실을 재발견하는 대신, 이미지당 수 분짜리 최소 런으로 한 번에 확정한다.
#
# 사용(이미지만 바꿔가며):
#   sky launch -c tfct-pf sky/preflight.sky.yaml --infra nebius -y --down \
#     --image-id docker:ghcr.io/jaegookyou/training-framework-comparison-tutorial/<name>:latest
#
# 판정: exit 0=OK / 1=이 GPU 커널 없음 / 2=torch 없음·GPU 안 보임.

name: tfct-preflight

resources:
  accelerators: RTX6000:1        # 실제 검증에 쓸 GPU 와 **같은 것**이어야 의미가 있다
  use_spot: true
  image_id: docker:ghcr.io/jaegookyou/training-framework-comparison-tutorial/trl:latest  # --image-id 로 override

workdir: .

setup: |
  pip install -e .              # tfct-preflight 콘솔 스크립트를 깐다(실패하면 진단 자체가 무의미 → 안 숨긴다)

run: |
  nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv || true
  # ⚠️ **콘솔 스크립트로 실행한다.** 생짜 `python3 -m ...` 은 컨테이너 안에서도 torch 없는 인터프리터를
  # 잡을 수 있다(2026-07-28 실측: torchtitan 이미지에서 `torch 없음` 오판 — 07-01 megatron-bridge 의
  # python3 불일치와 같은 계열). 콘솔 스크립트는 설치한 pip 의 인터프리터가 shebang 에 박혀 있어
  # tfct-run(학습 경로)과 **같은 환경**임이 보장된다.
  tfct-preflight
